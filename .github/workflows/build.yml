name: Build PrintBridge Executables

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    runs-on: windows-2019
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        
    - name: Install Windows Build Tools (for node-gyp)
      run: npm install --global windows-build-tools
      continue-on-error: true
        
    - name: Install dependencies
      run: npm install
      
    - name: Build Windows Executable
      run: npm run build:win
      
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rondapp-bridge-win
        path: dist/rondapp-bridge-win.exe

  build-mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build Mac Executable
      run: npm run build:mac
      
    - name: Upload Mac Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rondapp-bridge-mac
        path: dist/rondapp-bridge-mac
