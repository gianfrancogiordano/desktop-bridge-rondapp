name: Build PrintBridge Installers

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    # No native addons anymore (printing goes through PowerShell/winspool), so no node-gyp / VS toolchain needed.
    - name: Install dependencies
      run: npm ci

    - name: Build Windows installer
      run: npm run build:win

    - name: Upload Windows installer
      uses: actions/upload-artifact@v4
      with:
        name: rondapp-printbridge-windows
        path: release/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build macOS installers
      run: npm run build:mac

    - name: Upload macOS installers
      uses: actions/upload-artifact@v4
      with:
        name: rondapp-printbridge-mac
        path: release/*.dmg
